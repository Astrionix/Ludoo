<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Real-Time Multiplayer</title>
  <style>
    :root {
      --bg: #07101E;
      --panel: #0d1b2e;
      --gold: #f5c84b;
      --gold-dark: #e8a928;
      --red: #e3132b;
      --green: #0abf50;
      --blue: #086be8;
      --yellow: #ffc928;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: var(--gold);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #8a9bb5;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Auth Modal Overlay */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 9, 18, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .auth-card {
      background: var(--panel);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      text-align: center;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid #1c314f;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #8a9bb5;
      border-bottom: 2px solid transparent;
    }

    .auth-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #a0b3ce;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #1c314f;
      background: #040912;
      color: #fff;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .auth-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-weight: bold;
      font-size: 16px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(245, 200, 75, 0.4);
    }

    .auth-msg {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    .msg-error { color: var(--red); }
    .msg-success { color: var(--green); }

    /* Dashboard & Game Area */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: var(--panel);
      border: 2px solid #1c314f;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      min-width: 300px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 10px;
      background: #333;
    }

    .status-connected { background: #0abf50; color: #000; }
    .status-disconnected { background: #e3132b; color: #fff; }

    button {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border: none;
      color: #000;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:disabled {
      background: #4a5768;
      color: #888;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .dice-box {
      width: 80px;
      height: 80px;
      background: #f7f5ef;
      border-radius: 16px;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      margin: 15px 0;
      border: 3px solid var(--gold);
    }

    .log-box {
      background: #040912;
      border: 1px solid #14243b;
      border-radius: 8px;
      height: 220px;
      overflow-y: auto;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      color: #72ecac;
    }

    .token-grid {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .token-btn {
      background: #1c314f;
      color: #fff;
      border: 1px solid #2d4c78;
      border-radius: 6px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <!-- Email + Password Auth Modal -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h2 style="color: var(--gold); margin-top: 0;">LUDO MULTIPLAYER</h2>
      <div class="auth-tabs">
        <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Log In</div>
        <div id="tabSignup" class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</div>
      </div>

      <!-- Login Form -->
      <form id="formLogin" onsubmit="handleAuthSubmit(event, 'login')">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="player@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn">Log In</button>
      </form>

      <!-- Signup Form -->
      <form id="formSignup" onsubmit="handleAuthSubmit(event, 'signup')" style="display: none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Alex Dragon" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="player@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="auth-btn">Create Account</button>
      </form>

      <div id="authMsg" class="auth-msg"></div>
    </div>
  </div>

  <h1>Ludo Real-Time Multiplayer</h1>
  <div class="subtitle">Email Authentication & Authoritative Low-Latency Engine</div>

  <div class="container">
    <div class="card">
      <div id="statusBadge" class="status-badge status-disconnected">DISCONNECTED</div>
      <h3>Player Dashboard</h3>
      
      <div style="margin-bottom: 15px;">
        <div>User: <strong id="userDisplayName" style="color: var(--gold);">-</strong></div>
        <div style="font-size: 13px; color: #8a9bb5;">Coins: <span id="userCoins" style="color: #ffc928;">1000</span> 🪙</div>
      </div>

      <button id="btnConnect" onclick="connect()">Join Matchmaking</button>

      <div style="margin-top: 20px;">
        <div style="font-weight: bold;">Current Turn: <span id="turnText" style="color: var(--gold);">-</span></div>
        <div class="dice-box" id="diceVal">?</div>
        <button id="btnRoll" onclick="rollDice()" disabled>Roll Dice</button>
      </div>

      <div style="margin-top: 15px;">
        <div style="font-weight: bold; margin-bottom: 5px;">Move Token:</div>
        <div class="token-grid">
          <button class="token-btn" onclick="moveToken(0)">Token 0</button>
          <button class="token-btn" onclick="moveToken(1)">Token 1</button>
          <button class="token-btn" onclick="moveToken(2)">Token 2</button>
          <button class="token-btn" onclick="moveToken(3)">Token 3</button>
        </div>
      </div>

      <div style="margin-top: 15px;">
        <button onclick="toggleNetworkLoss()" style="background: #e3132b; color: #fff;">Simulate Network Drop</button>
      </div>
    </div>

    <div class="card">
      <h3>Live Server Event Log</h3>
      <div class="log-box" id="logBox">Authenticated.<br>Click 'Join Matchmaking' to start...</div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let ws = null;
    let playerId = null;
    let lastSeq = 0;
    let matchId = null;

    function switchAuthTab(type) {
      document.getElementById('authMsg').innerText = '';
      if (type === 'login') {
        document.getElementById('tabLogin').className = 'auth-tab active';
        document.getElementById('tabSignup').className = 'auth-tab';
        document.getElementById('formLogin').style.display = 'block';
        document.getElementById('formSignup').style.display = 'none';
      } else {
        document.getElementById('tabLogin').className = 'auth-tab';
        document.getElementById('tabSignup').className = 'auth-tab active';
        document.getElementById('formLogin').style.display = 'none';
        document.getElementById('formSignup').style.display = 'block';
      }
    }

    async function handleAuthSubmit(event, mode) {
      event.preventDefault();
      const msgBox = document.getElementById('authMsg');
      msgBox.className = 'auth-msg';
      msgBox.innerText = 'Processing...';

      const endpoint = mode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
      const body = mode === 'signup' ? {
        name: document.getElementById('signupName').value,
        email: document.getElementById('signupEmail').value,
        password: document.getElementById('signupPassword').value
      } : {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (data.success) {
          msgBox.className = 'auth-msg msg-success';
          msgBox.innerText = data.message || 'Success!';

          currentUser = data.profile || { id: data.user.id, username: body.name || body.email.split('@')[0], coins: 1000 };
          playerId = currentUser.id;

          document.getElementById('userDisplayName').innerText = currentUser.username;
          document.getElementById('userCoins').innerText = currentUser.coins || 1000;

          setTimeout(() => {
            document.getElementById('authOverlay').style.display = 'none';
          }, 600);
        } else {
          msgBox.className = 'auth-msg msg-error';
          msgBox.innerText = data.error || 'Authentication failed.';
        }
      } catch (err) {
        msgBox.className = 'auth-msg msg-error';
        msgBox.innerText = 'Network error: ' + err.message;
      }
    }

    function log(msg) {
      const box = document.getElementById('logBox');
      box.innerHTML += '<div>' + msg + '</div>';
      box.scrollTop = box.scrollHeight;
    }

    function connect() {
      if (!playerId) {
        alert('Please log in first.');
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      log(`Connecting to ${wsUrl}...`);

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('statusBadge').className = 'status-badge status-connected';
        document.getElementById('statusBadge').innerText = 'CONNECTED';
        log('CONNECTED to server!');

        if (matchId && lastSeq > 0) {
          log(`Requesting RECONNECT for match ${matchId} with lastSeq #${lastSeq}...`);
          ws.send(JSON.stringify({
            type: 'RECONNECT_REQUEST',
            playerId: playerId,
            payload: {
              matchId: matchId,
              lastReceivedSequence: lastSeq
            }
          }));
        } else {
          ws.send(JSON.stringify({
            type: 'JOIN_MATCHMAKING',
            playerId: playerId,
            payload: { name: currentUser.username }
          }));
        }
      };

      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (data.seq) {
          lastSeq = data.seq;
          ws.send(JSON.stringify({ type: 'ACK', seq: data.seq }));
        }

        log(`[#${data.seq || '-'}] Event: ${data.type}`);

        if (data.type === 'GAME_STARTED') {
          matchId = data.payload.matchId;
          log(`🎮 Match Started! Room: ${matchId}`);
        } else if (data.type === 'TURN_CHANGED') {
          document.getElementById('turnText').innerText = `${data.payload.color} (${data.payload.playerId})`;
          const isMyTurn = (data.payload.playerId === playerId);
          document.getElementById('btnRoll').disabled = !isMyTurn;
        } else if (data.type === 'DICE_ROLLED') {
          document.getElementById('diceVal').innerText = data.payload.diceValue;
          log(`🎲 ${data.payload.color} rolled a ${data.payload.diceValue}!`);
        } else if (data.type === 'MOVE_CONFIRMED') {
          log(`♟️ ${data.payload.color} moved Token ${data.payload.tokenIndex} to position ${data.payload.newPos}`);
        } else if (data.type === 'DELTA_SYNC') {
          log(`⚡ Delta sync restored ${data.payload?.events?.length || 0} missed events!`);
        } else if (data.type === 'GAME_STATE_SNAPSHOT') {
          log(`📸 Full authoritative Game State Snapshot received!`);
        }
      };

      ws.onclose = () => {
        document.getElementById('statusBadge').className = 'status-badge status-disconnected';
        document.getElementById('statusBadge').innerText = 'DISCONNECTED';
        log('Connection closed.');
      };
    }

    function rollDice() {
      if (!ws) return;
      ws.send(JSON.stringify({
        type: 'ROLL_REQUEST',
        playerId: playerId,
        actionId: 'ACT_' + Math.random().toString(36).substring(2, 9)
      }));
    }

    function moveToken(idx) {
      if (!ws) return;
      ws.send(JSON.stringify({
        type: 'MOVE_REQUEST',
        playerId: playerId,
        actionId: 'ACT_' + Math.random().toString(36).substring(2, 9),
        payload: { tokenIndex: idx }
      }));
    }

    function toggleNetworkLoss() {
      if (ws) {
        log('Simulating Network Failure...');
        ws.close();
        setTimeout(() => {
          log('Attempting automatic reconnection with lastReceivedSequence #' + lastSeq);
          connect();
        }, 3000);
      }
    }
  </script>
</body>
</html>
