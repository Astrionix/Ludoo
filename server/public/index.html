<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Real-Time Web Test Client</title>
  <style>
    :root {
      --bg: #07101E;
      --panel: #0d1b2e;
      --gold: #f5c84b;
      --red: #e3132b;
      --green: #0abf50;
      --blue: #086be8;
      --yellow: #ffc928;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: var(--gold);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #8a9bb5;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: var(--panel);
      border: 2px solid #1c314f;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      min-width: 300px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 10px;
      background: #333;
    }

    .status-connected { background: #0abf50; color: #000; }
    .status-weak { background: #ffc928; color: #000; }
    .status-disconnected { background: #e3132b; color: #fff; }

    button {
      background: linear-gradient(135deg, #f5c84b, #e8a928);
      border: none;
      color: #000;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 200, 75, 0.4);
    }

    button:disabled {
      background: #4a5768;
      color: #888;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .dice-box {
      width: 80px;
      height: 80px;
      background: #f7f5ef;
      border-radius: 16px;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      margin: 15px 0;
      border: 3px solid var(--gold);
    }

    .log-box {
      background: #040912;
      border: 1px solid #14243b;
      border-radius: 8px;
      height: 200px;
      overflow-y: auto;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      color: #72ecac;
    }

    .token-grid {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .token-btn {
      background: #1c314f;
      color: #fff;
      border: 1px solid #2d4c78;
      border-radius: 6px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <h1>Ludo Real-Time Test Client</h1>
  <div class="subtitle">Simulate games live in browser without installing an APK!</div>

  <div class="container">
    <div class="card">
      <div id="statusBadge" class="status-badge status-disconnected">DISCONNECTED</div>
      <h3>Player Controls</h3>
      
      <div>
        <label>Player Name: </label>
        <input type="text" id="playerName" value="Player_1" style="padding: 6px; border-radius: 4px; border: 1px solid #333;">
        <button id="btnConnect" onclick="connect()">Join Match</button>
      </div>

      <div style="margin-top: 20px;">
        <div style="font-weight: bold;">Current Turn: <span id="turnText" style="color: var(--gold);">-</span></div>
        <div class="dice-box" id="diceVal">?</div>
        <button id="btnRoll" onclick="rollDice()" disabled>Roll Dice</button>
      </div>

      <div style="margin-top: 15px;">
        <div style="font-weight: bold; margin-bottom: 5px;">Move Token:</div>
        <div class="token-grid">
          <button class="token-btn" onclick="moveToken(0)">Token 0</button>
          <button class="token-btn" onclick="moveToken(1)">Token 1</button>
          <button class="token-btn" onclick="moveToken(2)">Token 2</button>
          <button class="token-btn" onclick="moveToken(3)">Token 3</button>
        </div>
      </div>

      <div style="margin-top: 15px;">
        <button onclick="toggleNetworkLoss()" style="background: #e3132b; color: #fff;">Simulate Network Drop</button>
      </div>
    </div>

    <div class="card">
      <h3>Live Server Event Log</h3>
      <div class="log-box" id="logBox">System initialized.<br>Click 'Join Match' to connect...</div>
    </div>
  </div>

  <script>
    let ws = null;
    let playerId = 'PLAYER_' + Math.floor(Math.random() * 10000);
    let lastSeq = 0;
    let matchId = null;

    function log(msg) {
      const box = document.getElementById('logBox');
      box.innerHTML += '<div>' + msg + '</div>';
      box.scrollTop = box.scrollHeight;
    }

    function connect() {
      const wsUrl = `ws://${window.location.hostname || 'localhost'}:${window.location.port || '3000'}`;
      log(`Connecting to ${wsUrl}...`);

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('statusBadge').className = 'status-badge status-connected';
        document.getElementById('statusBadge').innerText = 'CONNECTED';
        log('CONNECTED to server!');

        const pName = document.getElementById('playerName').value;
        ws.send(JSON.stringify({
          type: 'JOIN_MATCHMAKING',
          playerId: playerId,
          payload: { name: pName }
        }));
      };

      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (data.seq) {
          lastSeq = data.seq;
          ws.send(JSON.stringify({ type: 'ACK', seq: data.seq }));
        }

        log(`[#${data.seq || '-'}] Event: ${data.type}`);

        if (data.type === 'GAME_STARTED') {
          matchId = data.payload.matchId;
          log(`🎮 Match Started! Room: ${matchId}`);
        } else if (data.type === 'TURN_CHANGED') {
          document.getElementById('turnText').innerText = `${data.payload.color} (${data.payload.playerId})`;
          const isMyTurn = (data.payload.playerId === playerId);
          document.getElementById('btnRoll').disabled = !isMyTurn;
        } else if (data.type === 'DICE_ROLLED') {
          document.getElementById('diceVal').innerText = data.payload.diceValue;
          log(`🎲 ${data.payload.color} rolled a ${data.payload.diceValue}!`);
        } else if (data.type === 'MOVE_CONFIRMED') {
          log(`♟️ ${data.payload.color} moved Token ${data.payload.tokenIndex} to position ${data.payload.newPos}`);
        } else if (data.type === 'DELTA_SYNC') {
          log(`⚡ Delta sync restored ${data.payload?.events?.length || 0} missed events!`);
        } else if (data.type === 'GAME_STATE_SNAPSHOT') {
          log(`📸 Full authoritative Game State Snapshot received!`);
        }
      };

      ws.onclose = () => {
        document.getElementById('statusBadge').className = 'status-badge status-disconnected';
        document.getElementById('statusBadge').innerText = 'DISCONNECTED';
        log('Connection closed.');
      };
    }

    function rollDice() {
      if (!ws) return;
      ws.send(JSON.stringify({
        type: 'ROLL_REQUEST',
        playerId: playerId,
        actionId: 'ACT_' + Math.random().toString(36).substring(2, 9)
      }));
    }

    function moveToken(idx) {
      if (!ws) return;
      ws.send(JSON.stringify({
        type: 'MOVE_REQUEST',
        playerId: playerId,
        actionId: 'ACT_' + Math.random().toString(36).substring(2, 9),
        payload: { tokenIndex: idx }
      }));
    }

    function toggleNetworkLoss() {
      if (ws) {
        log('Simulating Network Failure...');
        ws.close();
        setTimeout(() => {
          log('Attempting automatic reconnection with lastReceivedSequence #' + lastSeq);
          connect();
        }, 3000);
      }
    }
  </script>
</body>
</html>
