name: Android & Server CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android App & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Ludo-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: "Boooo Ludo ${{ github.ref_name }}"
          body: |
            🎮 **Boooo Ludo Official Release ${{ github.ref_name }}**

            ### 🚀 Features Included:
            - **Global Real-Time Multiplayer**: Connect and play with players across all regions via `wss://ludoo-d085.onrender.com`.
            - **Email & Password Authentication**: Integrated Supabase Auth.
            - **Pass & Play / Play with Friends**: Play locally on the same device with friends.
            - **Updated 3D Icon & Splash**: Modern 3D Boooo launcher icon and clean splash screen.
            - **Target Android 14**: Built with API 34.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-server:
    name: Test Real-Time Server Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Real-Time Protocol Tests
        run: |
          cd server
          npm test
